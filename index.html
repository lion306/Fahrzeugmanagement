<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahrzeugmanagement</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 Fahrzeugmanagement</h1>
            <button class="btn btn-settings" id="settings-btn" title="Einstellungen">⚙️ Einstellungen</button>
        </header>

        <main>
            <!-- Formular zum Hinzufügen/Bearbeiten -->
            <section class="form-section">
                <h2 id="form-title">Neues Fahrzeug anlegen</h2>
                <form id="vehicle-form">
                    <input type="hidden" id="vehicle-id">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="gw-nr">GW-Nr.</label>
                            <input type="text" id="gw-nr" placeholder="z.B. GW-2024-001" required>
                        </div>

                        <div class="form-group">
                            <label for="fahrgestellnummer">Fahrgestellnummer</label>
                            <input type="text" id="fahrgestellnummer" placeholder="z.B. WDB1234567890" required>
                        </div>

                        <div class="form-group">
                            <label for="hersteller">Hersteller</label>
                            <select id="hersteller" required>
                                <option value="">-- Bitte wählen --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="modell">Modell</label>
                            <input type="text" id="modell" placeholder="z.B. E-Klasse" required>
                        </div>

                        <div class="form-group">
                            <label for="herkunft">Herkunft</label>
                            <select id="herkunft" required>
                                <option value="">-- Bitte wählen --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="wa-nr">WA-Nr.</label>
                            <input type="text" id="wa-nr" placeholder="z.B. WA-2024-001" required>
                        </div>

                        <div class="form-group">
                            <label for="fremdfirma">Fremdfirma</label>
                            <select id="fremdfirma">
                                <option value="">-- Keine --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="aufbereiter">Aufbereiter</label>
                            <select id="aufbereiter">
                                <option value="">-- Keine --</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submit-btn">Fahrzeug speichern</button>
                        <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">Abbrechen</button>
                    </div>
                </form>
            </section>

            <!-- Suchleiste -->
            <section class="search-section">
                <input type="text" id="search-input" placeholder="Fahrzeuge durchsuchen...">
            </section>

            <!-- Fahrzeugliste -->
            <section class="list-section">
                <h2>Fahrzeuge <span id="vehicle-count" class="count-badge">0</span></h2>
                <div class="table-container">
                    <table id="vehicle-table">
                        <thead>
                            <tr>
                                <th>GW-Nr.</th>
                                <th>Fahrgestellnummer</th>
                                <th>Hersteller</th>
                                <th>Modell</th>
                                <th>Herkunft</th>
                                <th>WA-Nr.</th>
                                <th>Fremdfirma</th>
                                <th>Aufbereiter</th>
                                <th>Aktionen</th>
                            </tr>
                        </thead>
                        <tbody id="vehicle-list">
                            <!-- Fahrzeuge werden hier dynamisch eingefügt -->
                        </tbody>
                    </table>
                </div>
                <p id="no-vehicles" class="empty-message">Keine Fahrzeuge vorhanden. Legen Sie ein neues Fahrzeug an.</p>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Fahrzeugmanagement</p>
        </footer>
    </div>

    <!-- Einstellungen Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ Einstellungen - Stammdaten</h2>
                <button class="modal-close" id="settings-close">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Tab Navigation -->
                <div class="settings-tabs">
                    <button class="tab-btn active" data-tab="fremdfirmen">Fremdfirmen</button>
                    <button class="tab-btn" data-tab="aufbereiter">Aufbereiter</button>
                    <button class="tab-btn" data-tab="hersteller">Hersteller</button>
                    <button class="tab-btn" data-tab="herkunft">Herkunft</button>
                </div>

                <!-- Tab Content -->
                <div class="tab-content">
                    <!-- Fremdfirmen Tab -->
                    <div class="tab-pane active" id="tab-fremdfirmen">
                        <div class="add-item-form">
                            <input type="text" id="new-fremdfirma" placeholder="Neue Fremdfirma eingeben...">
                            <button class="btn btn-primary btn-add" onclick="settingsManager.addItem('fremdfirmen')">Hinzufügen</button>
                        </div>
                        <ul class="settings-list" id="list-fremdfirmen"></ul>
                    </div>

                    <!-- Aufbereiter Tab -->
                    <div class="tab-pane" id="tab-aufbereiter">
                        <div class="add-item-form">
                            <input type="text" id="new-aufbereiter" placeholder="Neuen Aufbereiter eingeben...">
                            <button class="btn btn-primary btn-add" onclick="settingsManager.addItem('aufbereiter')">Hinzufügen</button>
                        </div>
                        <ul class="settings-list" id="list-aufbereiter"></ul>
                    </div>

                    <!-- Hersteller Tab -->
                    <div class="tab-pane" id="tab-hersteller">
                        <div class="add-item-form">
                            <input type="text" id="new-hersteller" placeholder="Neuen Hersteller eingeben...">
                            <button class="btn btn-primary btn-add" onclick="settingsManager.addItem('hersteller')">Hinzufügen</button>
                        </div>
                        <ul class="settings-list" id="list-hersteller"></ul>
                    </div>

                    <!-- Herkunft Tab -->
                    <div class="tab-pane" id="tab-herkunft">
                        <div class="add-item-form">
                            <input type="text" id="new-herkunft" placeholder="Neue Herkunft eingeben...">
                            <button class="btn btn-primary btn-add" onclick="settingsManager.addItem('herkunft')">Hinzufügen</button>
                        </div>
                        <ul class="settings-list" id="list-herkunft"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
